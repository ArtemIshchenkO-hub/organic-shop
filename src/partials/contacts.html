<section class="contacts" id="contacts">
  <div class="container">
    <div class="contats-content-wrap">
      <div class="contacts-title-wrap">
        <p class="contacts-subtitle">Contacts</p>
        <h2 class="contacts-title">Get in Touch</h2>
        <p class="contacts-title-subtext">
          We'd love to hear from you anytime!
        </p>
      </div>
      <address class="contacts-address">
        <ul class="contacts-address-list">
          <li class="contacts-address-item">
            <svg width="24px" height="24px" class="contacts-address-icon">
              <use href="/img/sprite.svg#icon-envelope"></use>
            </svg>
            <a href="mailto:hello@organicstore.com" class="contacts-list-mail"
              >hello@organicstore.com</a
            >
          </li>
          <li class="contacts-address-item">
            <svg width="24px" height="24px" class="contacts-address-icon">
              <use href="/img/sprite.svg#icon-phone"></use>
            </svg>
            <a href="tel:+15553291024" class="contacts-list-tel"
              >+1 (555) 329-1024</a
            >
          </li>
        </ul>
      </address>
      <form class="contacts-form" novalidate>
        <label for="name" class="contacts-form-label">Name</label>
        <input
          name="name"
          id="name"
          type="text"
          class="contacts-form-input"
          placeholder="Sarah"
          required
        />
        <p class="form-error-message is-hidden"></p>

        <label for="email" class="contacts-form-label">Email</label>
        <input
          name="email"
          id="email"
          type="email"
          class="contacts-form-input"
          placeholder="hello@organic.com"
          required
        />
        <p class="form-error-message is-hidden"></p>

        <label for="textarea" class="contacts-form-label">Message</label>
        <textarea
          id="textarea"
          name="message"
          placeholder="Type your message..."
          maxlength="500"
          class="contacts-form-message"
          required
        ></textarea>
        <p class="form-error-message is-hidden"></p>

        <button type="submit" class="contacts-form-button button button-green">
          Submit
        </button>
      </form>
    </div>
    <picture>
      <source
        type="image/avif"
        srcset="
          ./img/contacts/avif/contacts@1x.avif 1x,
          ./img/contacts/avif/contacts@2x.avif 2x
        "
      />

      <source
        type="image/webp"
        srcset="
          ./img/contacts/webp/contacts@1x.webp 1x,
          ./img/contacts/webp/contacts@2x.webp 2x
        "
      />

      <img
        src="./img/contacts/contacts@1x.jpg"
        srcset="
          ./img/contacts/contacts@1x.jpg 1x,
          ./img/contacts/contacts@2x.jpg 2x
        "
        alt="Friendly team"
        width="343"
        height="343"
        class="contacts-image"
        loading="lazy"
      />
    </picture>
  </div>
</section>
