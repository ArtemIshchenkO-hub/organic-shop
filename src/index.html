<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Organic Shop</title>

    <link
      rel="preload"
      as="image"
      imagesrcset="img/bg/avif/herobg-m@1x.avif 1x, img/bg/avif/herobg-m@2x.avif 2x"
      type="image/avif"
      media="(max-width: 767px)"
    />

    <link
      rel="preload"
      as="image"
      imagesrcset="img/bg/avif/herobg-t@1x.avif 1x, img/bg/avif/herobg-t@2x.avif 2x"
      type="image/avif"
      media="(min-width: 768px) and (max-width: 1439px)"
    />

    <link
      rel="preload"
      as="image"
      imagesrcset="img/bg/avif/herobg-d@1x.avif 1x, img/bg/avif/herobg-d@2x.avif 2x"
      type="image/avif"
      media="(min-width: 1440px)"
    />

    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <load src="./partials/header.html" />

    <main>
      <load src="./partials/hero.html" />
      <load src="./partials/mission.html" />
      <load src="./partials/benefits.html" />
      <load src="./partials/assorts.html" />
      <load src="./partials/feedback.html" />
      <load src="./partials/faq.html" />
      <load src="./partials/contacts.html" />
    </main>

    <load src="./partials/footer.html" />
    <load src="./partials/back-to-top-btn.html" />

    <script type="module" src="./main.js"></script>
  </body>
</html>
